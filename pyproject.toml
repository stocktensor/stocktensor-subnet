[project]
name = "stocktensor-subnet"
version = "0.1.0"
description = "Bittensor subnet where AI miners forecast Robinhood Chain stock tokens, scored by validators against Chainlink prices."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.15"
authors = [{ name = "Stocktensor", email = "tao@stocktensor.io" }]
keywords = ["bittensor", "subnet", "robinhood-chain", "tokenized-stocks", "forecasting"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "bittensor>=11.1,<12",
    "aiohttp>=3.10,<4",
]

[project.urls]
Homepage = "https://stocktensor.io"
Repository = "https://github.com/stocktensor/stocktensor-subnet"

[project.scripts]
stx-miner = "neurons.miner:main"
stx-validator = "neurons.validator:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stocktensor", "neurons"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
